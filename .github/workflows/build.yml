name: Build iOS IPA

# Ejecución manual desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Identificador de la aplicación
        required: true
        default: ch.cclerc.muguet.ios
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.1"
  RUST_TARGET: aarch64-apple-ios
  CARGO_TERM_COLOR: always

jobs:
  build-ios:
    # Runner Apple Silicon con Xcode moderno.
    runs-on: macos-26
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Comprobar Xcode y arquitectura
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # XcodeGen genera el proyecto; Binaryen proporciona wasm-opt.
      - name: Instalar dependencias
        run: |
          set -euo pipefail
          brew install xcodegen binaryen
          xcodegen --version
          wasm-opt --version

      - name: Configurar Rust para iOS
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --no-modify-path
          fi

          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup target add "${RUST_TARGET}" --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      # --ipa firma con Muguet-sideload.entitlements.
      # Conserva los demás permisos existentes en ambos archivos.
      - name: Inyectar Increased Memory Limit
        run: |
          set -euo pipefail

          for plist in \
            ios/Muguet.entitlements \
            ios/Muguet-sideload.entitlements
          do
            test -f "${plist}"

            if /usr/libexec/PlistBuddy \
              -c "Print :com.apple.developer.kernel.increased-memory-limit" \
              "${plist}" >/dev/null 2>&1
            then
              /usr/libexec/PlistBuddy \
                -c "Delete :com.apple.developer.kernel.increased-memory-limit" \
                "${plist}"
            fi

            /usr/libexec/PlistBuddy \
              -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" \
              "${plist}"

            plutil -lint "${plist}"
          done

      # Usa el script oficial: compila Rust, genera el proyecto,
      # ejecuta xcodebuild y empaqueta build/Muguet.ipa.
      # Esta IPA tiene firma ad hoc y requiere resignarse para instalarla.
      # Sin game.zip no se incluye el código AOT del juego.
      # Wasmtime se obtiene como dependencia Cargo, no como CLI de Homebrew.
      - name: Compilar IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          sh ./make-ios.sh --ipa

      - name: Verificar IPA
        run: |
          set -euo pipefail
          test -s build/Muguet.ipa
          unzip -tq build/Muguet.ipa

          APP="target/ios-xcode/Build/Products/Release-iphoneos/Muguet.app"
          test -d "${APP}"
          codesign --verify --verbose=2 "${APP}"

      # Descarga disponible en Artifacts al finalizar correctamente.
      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-${{ github.run_number }}
          path: build/Muguet.ipa
          if-no-files-found: error
          retention-days: 14
